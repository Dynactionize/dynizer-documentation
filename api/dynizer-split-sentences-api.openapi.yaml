openapi: 3.1.0
info:
  version: 0.1.0
  title: split-sentences-api
  description: 'Sentence/clause splitting analyzer for pipeline-api (the `split` flow).


    A pre-processing step modelled on text extraction: pipeline-api calls `POST /split`
    once with `{document, webhook, remote_id}`; the service acks `{id}`, sentencizes
    on a Celery worker, and POSTs `{id, remote_id, status, segments}` to the `webhook`
    URL. Single-call and async. Inbound auth was removed — reached only over the internal
    network. Designed as the split step in `Extract -> Split -> Analyze -> Plugins`;
    see `docs/verify_pipeline_chaining.md`.'
  contact:
    name: Consono
    email: info@consono.ai
    url: https://consono.ai/
  license:
    name: Proprietary
